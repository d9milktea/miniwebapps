<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>響應式五子棋</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }
    h1 {
      margin-bottom: 10px;
    }
    #status {
      margin-bottom: 10px;
      font-size: 18px;
    }
    #board-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 80vh;
      max-width: 90vmin;  /* 讓棋盤適應螢幕大小，保持正方形 */
      max-height: 90vmin;
    }
    #board {
      display: grid;
      background-color: #333;
      aspect-ratio: 1 / 1; /* 確保棋盤永遠是正方形 */
      width: 100%;
      height: 100%;
    }
    .cell {
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid #999;
	  cursor: pointer;
    }
    .player1 {
      background-color: black;
      border-radius: 50%;
      width: 80%;
      height: 80%;
    }
    .player2 {
      background-color: white;
      border-radius: 50%;
      width: 80%;
      height: 80%;
      border: 1px solid #333;
    }
  </style>
</head>
<body>
  <h1>響應式五子棋</h1>
  <div id="status">目前玩家: 1 (黑棋)</div>
  <div id="board-container">
    <div id="board"></div>
  </div>

  <script>
    const boardSize = 15;
    let board = [];
    let currentPlayer = 1;
    const boardElement = document.getElementById('board');
    const statusElement = document.getElementById('status');

    // 初始化棋盤陣列
    for (let i = 0; i < boardSize; i++) {
      board[i] = Array(boardSize).fill(0);
    }

    // 渲染棋盤
    function renderBoard() {
      boardElement.innerHTML = '';
      boardElement.style.gridTemplateColumns = `repeat(${boardSize}, 1fr)`;
      boardElement.style.gridTemplateRows = `repeat(${boardSize}, 1fr)`;

      for (let i = 0; i < boardSize; i++) {
        for (let j = 0; j < boardSize; j++) {
          const cell = document.createElement('div');
          cell.classList.add('cell');
          cell.dataset.row = i;
          cell.dataset.col = j;
          cell.addEventListener('click', handleCellClick);
          if (board[i][j] === 1) {
            const piece = document.createElement('div');
            piece.classList.add('player1');
            cell.appendChild(piece);
          } else if (board[i][j] === 2) {
            const piece = document.createElement('div');
            piece.classList.add('player2');
            cell.appendChild(piece);
          }
          boardElement.appendChild(cell);
        }
      }
    }

    // 處理點擊
    function handleCellClick(event) {
      const row = parseInt(event.currentTarget.dataset.row);
      const col = parseInt(event.currentTarget.dataset.col);
      if (board[row][col] !== 0) return;

      board[row][col] = currentPlayer;
      renderBoard();

      if (checkWin(row, col, currentPlayer)) {
        statusElement.textContent = `玩家 ${currentPlayer} 獲勝！`;
        boardElement.style.pointerEvents = 'none';
        return;
      }

      currentPlayer = currentPlayer === 1 ? 2 : 1;
      statusElement.textContent = `目前玩家: ${currentPlayer} ${currentPlayer === 1 ? '(黑棋)' : '(白棋)'}`;
    }

    // 判斷勝利
    function checkWin(row, col, player) {
      const directions = [
        { dr: 0, dc: 1 }, // 水平
        { dr: 1, dc: 0 }, // 垂直
        { dr: 1, dc: 1 }, // 對角線 \
        { dr: 1, dc: -1 } // 對角線 /
      ];
      for (let d of directions) {
        let count = 1;
        count += countDirection(row, col, d.dr, d.dc, player);
        count += countDirection(row, col, -d.dr, -d.dc, player);
        if (count >= 5) return true;
      }
      return false;
    }

    // 計算某方向連續棋子數
    function countDirection(row, col, dr, dc, player) {
      let r = row + dr;
      let c = col + dc;
      let count = 0;
      while (r >= 0 && r < boardSize && c >= 0 && c < boardSize && board[r][c] === player) {
        count++;
        r += dr;
        c += dc;
      }
      return count;
    }

    // 調整棋盤大小
    function adjustBoardSize() {
      let minSize = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.8);
      boardElement.style.width = `${minSize}px`;
      boardElement.style.height = `${minSize}px`;
    }

    window.addEventListener('resize', adjustBoardSize);

    renderBoard();
    adjustBoardSize();
  </script>
</body>
</html>
