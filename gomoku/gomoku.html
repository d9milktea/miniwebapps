<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <title>響應式五子棋</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      /* 靠上 */
      height: 100vh;
      background-color: #f5f5f5;
      overflow: hidden;
      /* 防止滾動 */
      padding-top: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    #status {
      font-size: 20px;
      font-weight: bold;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
      color: white;
      background-color: black;
      /* 預設黑棋先 */
    }

    #board-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 80vh;
      max-width: 90vmin;
      max-height: 90vmin;
    }

    #board {
      display: grid;
      background-color: #333;
      aspect-ratio: 1 / 1;
      width: 100%;
      height: 100%;
    }

    .cell {
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid #999;
      cursor: pointer;
    }

    .player1 {
      background-color: black;
      border-radius: 50%;
      width: 80%;
      height: 80%;
    }

    .player2 {
      background-color: white;
      border-radius: 50%;
      width: 80%;
      height: 80%;
      border: 1px solid #333;
    }

    #winner-message {
      font-size: 24px;
      font-weight: bold;
      color: red;
      margin-top: 15px;
      display: none;
    }

    .restart-button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 18px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      display: none;
    }

    .restart-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>

<body>
  <h1>響應式五子棋</h1>
  <div id="status">目前玩家: 1 (黑棋)</div>
  <div id="board-container">
    <div id="board"></div>
  </div>
  <div id="winner-message"></div>
  <button class="restart-button" onclick="restartGame()">重新開始</button>

  <script>
    const boardSize = 15;
    let board = Array.from({ length: boardSize }, () => Array(boardSize).fill(0));
    let currentPlayer = 1;
    const boardElement = document.getElementById('board');
    const statusElement = document.getElementById('status');
    const winnerMessage = document.getElementById('winner-message');
    const restartButton = document.querySelector('.restart-button');

    // 渲染棋盤
    function renderBoard() {
      boardElement.innerHTML = '';
      boardElement.style.gridTemplateColumns = `repeat(${boardSize}, 1fr)`;
      boardElement.style.gridTemplateRows = `repeat(${boardSize}, 1fr)`;

      for (let i = 0; i < boardSize; i++) {
        for (let j = 0; j < boardSize; j++) {
          const cell = document.createElement('div');
          cell.classList.add('cell');
          cell.dataset.row = i;
          cell.dataset.col = j;
          cell.addEventListener('click', handleCellClick);

          if (board[i][j] === 1) {
            const piece = document.createElement('div');
            piece.classList.add('player1');
            cell.appendChild(piece);
          } else if (board[i][j] === 2) {
            const piece = document.createElement('div');
            piece.classList.add('player2');
            cell.appendChild(piece);
          }
          boardElement.appendChild(cell);
        }
      }
    }

    // 處理點擊
    function handleCellClick(event) {
      const row = parseInt(event.currentTarget.dataset.row);
      const col = parseInt(event.currentTarget.dataset.col);
      if (board[row][col] !== 0) return;

      board[row][col] = currentPlayer;
      renderBoard();

      if (checkWin(row, col, currentPlayer)) {
        statusElement.textContent = `🎉 玩家 ${currentPlayer} 獲勝！`;
        statusElement.style.backgroundColor = currentPlayer === 1 ? 'black' : 'red';
        winnerMessage.textContent = `🏆 玩家 ${currentPlayer} (${currentPlayer === 1 ? '黑棋' : '白棋'}) 獲勝！`;
        winnerMessage.style.display = 'block';
        boardElement.style.pointerEvents = 'none';
        restartButton.style.display = 'block';
        return;
      }

      currentPlayer = currentPlayer === 1 ? 2 : 1;
      statusElement.textContent = `目前玩家: ${currentPlayer} ${currentPlayer === 1 ? '(黑棋)' : '(白棋)'}`;
      statusElement.style.backgroundColor = currentPlayer === 1 ? 'black' : 'red';
    }

    // 判斷勝利
    function checkWin(row, col, player) {
      const directions = [
        { dr: 0, dc: 1 }, // 水平
        { dr: 1, dc: 0 }, // 垂直
        { dr: 1, dc: 1 }, // 對角線 \
        { dr: 1, dc: -1 } // 對角線 /
      ];
      for (let d of directions) {
        let count = 1;
        count += countDirection(row, col, d.dr, d.dc, player);
        count += countDirection(row, col, -d.dr, -d.dc, player);
        if (count >= 5) return true;
      }
      return false;
    }

    // 計算某方向連續棋子數
    function countDirection(row, col, dr, dc, player) {
      let count = 0, r = row + dr, c = col + dc;
      while (r >= 0 && r < boardSize && c >= 0 && c < boardSize && board[r][c] === player) {
        count++;
        r += dr;
        c += dc;
      }
      return count;
    }

    // 重新開始遊戲
    function restartGame() {
      board = Array.from({ length: boardSize }, () => Array(boardSize).fill(0));
      currentPlayer = 1;
      boardElement.style.pointerEvents = 'auto';
      winnerMessage.style.display = 'none';
      restartButton.style.display = 'none';
      statusElement.textContent = `目前玩家: 1 (黑棋)`;
      statusElement.style.backgroundColor = 'black';
      renderBoard();
    }

    renderBoard();
  </script>
</body>

</html>
